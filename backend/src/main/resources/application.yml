spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maramigo}
    username: ${DB_USER:maramigo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never

maramigo:
  account-encryption-key: ${ACCOUNT_ENCRYPTION_KEY:}
  verification-required: ${ACCOUNT_VERIFICATION_REQUIRED:true}
  mail:
    mode: ${ACCOUNT_MAIL_MODE:disabled}
    base-url: ${ACCOUNT_PUBLIC_URL:https://localhost}
    directory: ${ACCOUNT_MAIL_DIRECTORY:.runtime/mail}
    from: ${ACCOUNT_MAIL_FROM:}
    host: ${ACCOUNT_MAIL_HOST:}
    port: ${ACCOUNT_MAIL_PORT:587}
    username: ${ACCOUNT_MAIL_USERNAME:}
    password: ${ACCOUNT_MAIL_PASSWORD:}
